<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Healthcare Wellness Club wellness coaching, services, success stories and contact information.">
  <title>Healthcare Wellness Club - Home</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="pages/style.css">
  <link rel="stylesheet" href="pages/xampp-fixes.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main>
    <section class="container-fluid hero-section d-flex align-items-center justify-content-center text-center text-white">
      <div>
        <h1 class="display-4 fw-bold">Welcome to <span class="text-success">Healthcare Wellness Club</span></h1>
        <p class="lead">Your one-stop destination for achieving health and wellness.</p>
        <a href="pages/services.html" class="btn btn-success btn-lg mt-3">Explore Our Services</a>
      </div>
    </section>
  </main>

  <div class="floating-btns">
    <a href="https://wa.me/918858302744" target="_blank" rel="noopener">📱 Chat on WhatsApp</a>
    <a href="tel:+919876543210" class="call-btn">📞 Call Now</a>
  </div>

  <div class="modal fade" id="dailyTipModal" tabindex="-1" aria-labelledby="dailyTipLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="dailyTipLabel">🌿 Health Tip of the Day</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <p>Stay hydrated, include regular movement, balanced meals, enough sleep, and short screen breaks in your daily routine.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/site.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
      const el=document.getElementById('dailyTipModal');
      if(el&&window.bootstrap)new bootstrap.Modal(el).show();
    },2000));
  </script>
</body>
</html>
