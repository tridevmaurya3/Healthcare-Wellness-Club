v></section></main><div class="floating-btns"><a href="https://wa.me/919876543210" target="_blank" rel="noopener">📱 Chat on WhatsApp</a><a href="tel:+919876543210" class="call-btn">📞 Call Now</a></div><div id="footer-placeholder"></div><script src="../js/bootstrap.bundle.min.js"></script><script src="../js/site.js"></script><script>document.getElementById('contact-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,a=document.getElementById('form-alert'),b=f.querySelector('button');b.disabled=true;try{const r=await fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}});if(!r.ok)throw 0;a.className='alert alert-success';a.textContent='Thanks for your message! We’ll get back to you soon.';f.reset()}catch(x){a.className='alert alert-danger';a.textContent='Something went wrong. Please try again.'}finally{a.classList.remove('d-none');b.disabled=false}});</script></body></html>
