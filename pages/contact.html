<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Healthcare Wellness Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

<!-- navbar-placeholder -->
<div id="navbar-placeholder"></div>
 
<!-- Contact Section -->
<div class="container mt-4 mb-5">
  <div class="card-custom">
<div class="container mt-5">
  <div class="contact-section">
    <div class="contact-header">
      <h2>Contact Us</h2>
      <p class="text-muted">We’d love to hear from you! Fill out the form and we’ll get back shortly.</p>
    </div>
    <div class="row">
      <!-- Contact Form -->
      <div class="col-md-6">
        <form id="contact-form" action="https://formspree.io/f/xkgjqdyz" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="mobile" class="form-label">Your Mobile</label>
            <input type="number" class="form-control" id="mobile" name="mobile" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" name="_replyto" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
          </div>
          <div id="form-alert" class="alert d-none" role="alert"></div>
          <button type="submit" class="btn btn-success">Send Message</button>
        </form>
      </div>

      <!-- Contact Info -->
      <div class="col-md-6 mt-4 mt-md-0">
        <h5>Contact Details</h5>
        <p><strong>Phone:</strong> <a href="tel:+915483561586">+91-5483561586</a></p>
        <p><strong>Email:</strong> <a href="mailto:healthcare.wellnessclub@gmail.com">healthcare.wellnessclub@gmail.com</a></p>
        <p><strong>Location:</strong> Wellness Center, Ghazipur, Uttar Pradesh India</p>

        <div class="ratio ratio-16x9 mt-3">
          <iframe src="https://maps.google.com/maps?q=Ghazipur,India&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</div>
<!-- Floating WhatsApp + Call Buttons -->
<div class="floating-btns">
  <a href="https://wa.me/919876543210" target="_blank">📱 Chat on WhatsApp</a>
  <a href="tel:+919876543210" class="call-btn">📞 Call Now</a>
</div>
<!-- Submit Button -->
<script>
  document.getElementById("contact-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const form = e.target;
    const alertBox = document.getElementById("form-alert");

    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: {
        'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        alertBox.className = "alert alert-success";
        alertBox.innerText = "Thanks for your message! We'll get back to you soon.";
        alertBox.classList.remove("d-none");
        form.reset();
      } else {
        response.json().then(data => {
          alertBox.className = "alert alert-danger";
          alertBox.innerText = data.error || "Oops! Something went wrong.";
          alertBox.classList.remove("d-none");
        });
      }
    }).catch(() => {
      alertBox.className = "alert alert-danger";
      alertBox.innerText = "Something went wrong. Please try again.";
      alertBox.classList.remove("d-none");
    });
  });
</script>
<!-- Navbar Section -->
<script>
  // Load the navbar
  fetch('navbar.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('navbar-placeholder').innerHTML = data;

      const links = document.querySelectorAll('.nav-link');
      const currentPage = window.location.pathname.split('/').pop();

      links.forEach(link => {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
        }
      });
    });

  // ✅ Load the footer
  fetch('footer.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
    });
</script>
<!-- Floating Chat Icon -->
<div id="chat-toggle-btn"
     style="position: fixed; bottom: 150px; right: 20px; z-index: 9998; cursor: pointer;">

<iframe
  id="chatbot-frame"
  src="https://www.chatbase.co/chatbot-iframe/rWYfFJUdA4l7XbwTThmpz"
  width="350"
  height="500"
  style="display: none; position: fixed; bottom: 200px; right: 20px; border: none; z-index: 9999; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
</iframe>

<script>
  const chatBtn = document.getElementById('chat-toggle-btn');
  const chatbot = document.getElementById('chatbot-frame');
  let isOpen = false;

  chatBtn.addEventListener('click', () => {
    isOpen = !isOpen;
    chatbot.style.display = isOpen ? 'block' : 'none';

</script>
