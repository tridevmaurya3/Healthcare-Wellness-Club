name: STEP 22 final semantic polish
on:
  push:
    paths:
      - '.github/workflows/step22-final-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply semantic safety patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('business/config/bi_step22.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'new_leads'=>0,'lead_conversions'=>0,'conversion_rate'=>null,", "'new_leads'=>0,'lead_conversions'=>0,'cohort_converted'=>0,'conversion_rate'=>null,")
          old="if(business_table_exists($pdo,'crm_lead_conversions'))$m['lead_conversions']=(int)bi_step22_scalar($pdo,\"SELECT COUNT(DISTINCT lead_id) FROM crm_lead_conversions WHERE organization_id=? AND converted_at>=? AND converted_at<DATE_ADD(?,INTERVAL 1 DAY)\",[$orgId,$start,$end]);\n    if($m['new_leads']>0)$m['conversion_rate']=round($m['lead_conversions']/$m['new_leads']*100,2);"
          new="if(business_table_exists($pdo,'crm_lead_conversions'))$m['lead_conversions']=(int)bi_step22_scalar($pdo,\"SELECT COUNT(DISTINCT lead_id) FROM crm_lead_conversions WHERE organization_id=? AND converted_at>=? AND converted_at<DATE_ADD(?,INTERVAL 1 DAY)\",[$orgId,$start,$end]);\n    if(business_table_exists($pdo,'crm_leads'))$m['cohort_converted']=(int)bi_step22_scalar($pdo,\"SELECT COUNT(*) FROM crm_leads WHERE organization_id=? AND created_at>=? AND created_at<DATE_ADD(?,INTERVAL 1 DAY) AND stage='converted'\",[$orgId,$start,$end]);\n    if($m['new_leads']>0)$m['conversion_rate']=round($m['cohort_converted']/$m['new_leads']*100,2);"
          if old not in s: raise SystemExit('conversion marker not found')
          s=s.replace(old,new,1)
          old="$actual=array_key_exists($code,$metrics)?$metrics[$code]:null;$target=(float)$r['target_value'];$direction=(string)$r['direction_code'];$pct=null;$met=null;if($actual!==null&&abs($target)>0.000001){$pct=round((float)$actual/$target*100,1);$met=$direction==='lower_better'?(float)$actual<=$target:(float)$actual>=$target;}"
          new="$actual=array_key_exists($code,$metrics)?$metrics[$code]:null;if(in_array($code,['customer_receivable','supplier_payable'],true)&&!($start<=date('Y-m-d')&&$end>=date('Y-m-d')))$actual=null;$target=(float)$r['target_value'];$direction=(string)$r['direction_code'];$pct=null;$met=null;if($actual!==null&&abs($target)>0.000001){$av=(float)$actual;$pct=$direction==='lower_better'?($av<=0?100.0:round($target/$av*100,1)):round($av/$target*100,1);$met=$direction==='lower_better'?$av<=$target:$av>=$target;}"
          if old not in s: raise SystemExit('target marker not found')
          s=s.replace(old,new,1)
          old="$r['workflow_status']=$state[$r['key']]['signal_status']??'open';$r['workflow_note']=$state[$r['key']]['note']??null;"
          new="$stored=$state[$r['key']]['signal_status']??'open';$r['workflow_status']=$stored==='resolved'?'active_after_resolution':$stored;$r['workflow_note']=$state[$r['key']]['note']??null;"
          if old not in s: raise SystemExit('signal marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('business/step21_audit.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("$indexReady=str_contains($index,'dashboard_step21.php');", "$indexReady=str_contains($index,'dashboard_step21.php')||str_contains($index,'dashboard_step22.php');")
          p.write_text(s,encoding='utf-8')
          PY
      - name: PHP lint after polish
        run: |
          set -e
          for f in business/config/bi_step22.php business/executive_bi.php business/bi_targets.php business/bi_trends.php business/bi_funnel.php business/bi_profitability.php business/bi_exposure.php business/bi_action_center.php business/bi_export.php business/dashboard_step22.php business/step22_audit.php business/step21_audit.php business/index.php; do php -l "$f"; done
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/bi_step22.php business/step21_audit.php
          git diff --cached --quiet && exit 0
          git commit -m "STEP 22: finalize cohort targets signals and audit compatibility"
          git push origin HEAD:main
