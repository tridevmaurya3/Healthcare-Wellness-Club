name: STEP 22 one-time PHP lint
on:
  push:
    paths:
      - '.github/workflows/step22-lint.yml'
permissions:
  contents: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: PHP syntax lint
        run: |
          set -e
          : > business/config/step22_lint_report.txt
          files=(
            business/config/bi_step22.php
            business/executive_bi.php
            business/bi_targets.php
            business/bi_trends.php
            business/bi_funnel.php
            business/bi_profitability.php
            business/bi_exposure.php
            business/bi_action_center.php
            business/bi_export.php
            business/dashboard_step22.php
            business/step22_audit.php
            business/index.php
          )
          for f in "${files[@]}"; do php -l "$f" | tee -a business/config/step22_lint_report.txt; done
          echo 'STEP22_LINT=PASS' | tee -a business/config/step22_lint_report.txt
      - name: Commit proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step22_lint_report.txt
          git commit -m "STEP 22: capture PHP lint proof"
          git push origin HEAD:main
