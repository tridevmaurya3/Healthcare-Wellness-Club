name: One-time STEP 18 cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-step18-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove STEP 18 temporary validation artifacts
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/one-time-step18-mysql-smoke.yml \
            .github/workflows/one-time-step18-mysql-diagnostic.yml \
            .github/workflows/one-time-step18-mysql-keycase-fix.yml \
            .github/workflows/one-time-step18-mysql-smoke2.yml \
            business/config/step18_mysql_diagnostic.txt \
            business/config/step18_mysql_smoke_pass.txt \
            .github/workflows/one-time-step18-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary STEP 18 MySQL validation artifacts"
          git push origin main
