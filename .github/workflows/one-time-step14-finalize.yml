name: One-time STEP 14 finalize

on:
  push:
    paths:
      - '.github/workflows/one-time-step14-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final STEP 14 safety polish
        shell: python
        run: |
          from pathlib import Path

          service = Path('business/config/purchase_step14.php')
          text = service.read_text(encoding='utf-8')
          text = text.replace("SUM(CASE WHEN b.status='active' THEN b.return_credit ELSE 0 END) returns,", "SUM(CASE WHEN b.status='active' THEN b.return_credit ELSE 0 END) return_total,")
          text = text.replace("COALESCE(x.returns,0) return_credit", "COALESCE(x.return_total,0) return_credit")
          text = text.replace(
              "function purchase_step14_return_received(PDO $pdo, int $receiptItemId, float $qty, string $returnDate, string $reason): int",
              "function purchase_step14_return_received(PDO $pdo, int $receiptItemId, float $qty, string $returnDate, float $creditAmount, string $reason): int"
          )
          old = "$remaining=round((float)$ri['quantity_received']-(float)$ri['returned_quantity'],3);if($qty>$remaining+0.0005)throw new RuntimeException('Return quantity exceeds received quantity still available for return.');$credit=round($qty*(float)$ri['unit_cost'],2);"
          new = "$remaining=round((float)$ri['quantity_received']-(float)$ri['returned_quantity'],3);if($qty>$remaining+0.0005)throw new RuntimeException('Return quantity exceeds received quantity still available for return.');if($creditAmount<0)throw new RuntimeException('Supplier credit note amount cannot be negative.');$credit=round($creditAmount,2);"
          if old not in text:
              raise SystemExit('Purchase return credit calculation anchor not found')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          page = Path('business/purchase_returns.php')
          text = page.read_text(encoding='utf-8')
          old_call = "purchase_step14_return_received($pdo,(int)$_POST['receipt_item_id'],(float)$_POST['quantity'],(string)$_POST['return_date'],(string)($_POST['reason']??''))"
          new_call = "purchase_step14_return_received($pdo,(int)$_POST['receipt_item_id'],(float)$_POST['quantity'],(string)$_POST['return_date'],(float)($_POST['credit_amount']??0),(string)($_POST['reason']??''))"
          if old_call not in text:
              raise SystemExit('Purchase return page call anchor not found')
          text = text.replace(old_call, new_call, 1)
          old_form = '<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Reason>'
          new_form = '<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Actual Supplier Credit Note Amount<input type="number" min="0" step="0.01" name="credit_amount" required><small>Enter the actual supplier credit; it is not inferred from unit cost.</small></label><label>Reason>'
          if old_form not in text:
              raise SystemExit('Purchase return form anchor not found')
          text = text.replace(old_form, new_form, 1)
          text = text.replace('Return credit reduces supplier payable while the original Bill and Goods Receipt stay preserved.', 'The actual supplier Credit Note amount reduces payable while the original Bill and Goods Receipt stay preserved.')
          page.write_text(text, encoding='utf-8')

          analytics = Path('business/purchase_analytics.php')
          text = analytics.read_text(encoding='utf-8')
          text = text.replace("SUM(return_credit) returns,SUM(paid_amount)", "SUM(return_credit) return_total,SUM(paid_amount)")
          text = text.replace("$r['returns']", "$r['return_total']")
          analytics.write_text(text, encoding='utf-8')

      - name: PHP syntax check STEP 14
        run: |
          php -l business/config/purchase_step14.php
          php -l business/purchase_center.php
          php -l business/supplier_center.php
          php -l business/supplier_detail.php
          php -l business/purchase_orders.php
          php -l business/purchase_bills.php
          php -l business/purchase_receipts.php
          php -l business/supplier_payments.php
          php -l business/purchase_returns.php
          php -l business/purchase_analytics.php
          php -l business/purchase_export.php
          php -l business/step14_audit.php
          php -l business/dashboard_step14.php
          php -l business/index.php
          php -l business/global_search.php

      - name: Commit safety polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/purchase_step14.php business/purchase_returns.php business/purchase_analytics.php
          git commit -m "STEP 14: require explicit supplier return credit and finalize SQL safety"
          git push origin main
