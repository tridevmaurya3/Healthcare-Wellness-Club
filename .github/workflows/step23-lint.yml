name: STEP 23 lint and privacy validation
on:
  push:
    paths:
      - '.github/workflows/step23-lint.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final compatibility and privacy patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('business/config/public_store_step23.php')
          s = p.read_text(encoding='utf-8')
          old = "SELECT event_type,new_status,note,created_at FROM public_order_events WHERE organization_id=? AND public_order_id=? ORDER BY id"
          new = "SELECT event_type,new_status,CASE WHEN actor_user_id IS NULL THEN note ELSE NULL END note,created_at FROM public_order_events WHERE organization_id=? AND public_order_id=? ORDER BY id"
          if old not in s:
              raise SystemExit('public status query marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p = Path('business/step22_audit.php')
          s = p.read_text(encoding='utf-8')
          old = "$indexTruth=str_contains($index,'dashboard_step22.php');"
          new = "$indexTruth=str_contains($index,'dashboard_step22.php')||str_contains($index,'dashboard_step23.php');"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: PHP syntax lint
        run: |
          set -e
          : > business/config/step23_lint_report.txt
          files=(
            business/config/public_store_step23.php
            business/public_order_center.php
            business/public_order_detail.php
            business/public_order_export.php
            business/product_quote_detail.php
            business/dashboard_step23.php
            business/step23_audit.php
            business/step22_audit.php
            business/index.php
            shop/index.php
            shop/product.php
            shop/cart.php
            shop/checkout.php
            shop/submit.php
            shop/status.php
          )
          for f in "${files[@]}"; do php -l "$f" | tee -a business/config/step23_lint_report.txt; done
          echo 'STEP23_LINT=PASS' | tee -a business/config/step23_lint_report.txt
      - name: Commit proof and patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/public_store_step23.php business/step22_audit.php business/config/step23_lint_report.txt
          git commit -m "STEP 23: harden tracking privacy and capture lint proof"
          git push origin HEAD:main
