name: One-time STEP 17 search hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-step17-search-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Global Search permission-aware
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/global_search.php')
          s=p.read_text(encoding='utf-8')
          old="$pdo=business_db();$organizationId=(int)$pdo->query(\"SELECT id FROM organizations WHERE organization_code='HWC-001' LIMIT 1\")->fetchColumn();"
          new="$pdo=business_db();$gsUser=security_step17_current_user($pdo);$organizationId=(int)$pdo->query(\"SELECT id FROM organizations WHERE organization_code='HWC-001' LIMIT 1\")->fetchColumn();"
          if old not in s: raise SystemExit('Global Search DB marker missing')
          s=s.replace(old,new,1)
          replacements={
            "if($scope==='all'||$scope==='product')":"if(($scope==='all'||$scope==='product')&&security_step17_has_permission($pdo,'products.view',$gsUser))",
            "if($scope==='all'||$scope==='member')":"if(($scope==='all'||$scope==='member')&&security_step17_has_permission($pdo,'members.view',$gsUser))",
            "if($scope==='all'||$scope==='order')":"if(($scope==='all'||$scope==='order')&&security_step17_has_permission($pdo,'business.view',$gsUser))",
            "if($scope==='all'||$scope==='vp')":"if(($scope==='all'||$scope==='vp')&&security_step17_has_permission($pdo,'business.view',$gsUser))",
            "if($scope==='all'||$scope==='renewal')":"if(($scope==='all'||$scope==='renewal')&&security_step17_has_permission($pdo,'business.view',$gsUser))",
            "if($scope==='all'||$scope==='income')":"if(($scope==='all'||$scope==='income')&&security_step17_has_permission($pdo,'business.view',$gsUser))",
            "if($scope==='all'||$scope==='royalty')":"if(($scope==='all'||$scope==='royalty')&&security_step17_has_permission($pdo,'business.view',$gsUser))",
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit('Missing scope marker: '+a)
              s=s.replace(a,b,1)
          old="$key=gs_key($query);if($scope==='all'||$scope==='tool')foreach($tools as[$title,$keywords,$desc,$url,$badge]){if($query!==''&&!str_contains(gs_key($title.' '.$keywords.' '.$desc),$key))continue;$results[]=['type'=>'tool','title'=>$title,'subtitle'=>$desc,'value'=>'Open tool','url'=>$url,'badge'=>$badge];$counts['tool']++;}if($scope==='all'||$scope==='report')"
          new="$key=gs_key($query);if($error===null&&($scope==='all'||$scope==='tool'))foreach($tools as[$title,$keywords,$desc,$url,$badge]){$toolScript=basename((string)(parse_url($url,PHP_URL_PATH)??$url));$toolPermission=security_step17_route_permission($toolScript,'GET');if(!security_step17_has_permission($pdo,$toolPermission,$gsUser))continue;if($query!==''&&!str_contains(gs_key($title.' '.$keywords.' '.$desc),$key))continue;$results[]=['type'=>'tool','title'=>$title,'subtitle'=>$desc,'value'=>'Open tool','url'=>$url,'badge'=>$badge];$counts['tool']++;}if($error===null&&($scope==='all'||$scope==='report')&&security_step17_has_permission($pdo,'reports.view',$gsUser))"
          if old not in s: raise SystemExit('Global Search tool/report marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('business/step17_audit.php')
          s=p.read_text(encoding='utf-8')
          old="$searchIntegrated=str_contains($searchFile,\"['Security Center'\")&&str_contains($searchFile,\"['User Management'\");"
          new=old+"$searchPermissionAware=str_contains($searchFile,'security_step17_has_permission')&&str_contains($searchFile,'security_step17_route_permission');"
          if old not in s: raise SystemExit('STEP 17 search audit marker missing')
          s=s.replace(old,new,1)
          old2="s17add($checks,'Global Search includes Security commands',$searchIntegrated,$searchIntegrated?'Security tools indexed':'Security tools missing');"
          new2=old2+"\n    s17add($checks,'Global Search respects module permissions',$searchPermissionAware,$searchPermissionAware?'search data/tools are permission-filtered':'search permission filtering missing');"
          if old2 not in s: raise SystemExit('STEP 17 search check insertion missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

      - name: PHP syntax lint
        run: |
          set -e
          php -l business/global_search.php
          php -l business/step17_audit.php
          php -l business/config/security_step17.php
          php -l business/config/database.php
          php -l business/dashboard_step17.php

      - name: Commit permission-aware search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/global_search.php business/step17_audit.php
          git commit -m "STEP 17: enforce RBAC inside Global Search and final audit"
          git push origin main
