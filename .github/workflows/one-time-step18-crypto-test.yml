name: One-time STEP 18 crypto test

on:
  push:
    paths:
      - '.github/workflows/one-time-step18-crypto-test.yml'

permissions:
  contents: write

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify authenticated encryption round trip
        shell: bash
        run: |
          php -r '
          require "business/config/backup_step18.php";
          $payload=["format"=>BACKUP_STEP18_PACKAGE,"created_at"=>date(DATE_ATOM),"organization_code"=>"HWC-001","schema_fingerprint"=>str_repeat("a",64),"table_count"=>0,"row_count"=>0,"tables"=>[]];
          $plain=backup_step18_json($payload);
          $GLOBALS["__hwc_backup_passphrase"]="RoundTrip!Passphrase2026";
          [$env,$package]=backup_step18_encrypt_payload($plain,$payload["schema_fingerprint"],0,0);
          unset($GLOBALS["__hwc_backup_passphrase"]);
          $tmp=tempnam(sys_get_temp_dir(),"hwc18-");file_put_contents($tmp,$package);
          $decoded=backup_step18_decrypt_file($tmp,"RoundTrip!Passphrase2026");
          if(($decoded["payload"]["organization_code"]??"")!=="HWC-001")throw new RuntimeException("Round-trip payload mismatch");
          $wrongRejected=false;try{backup_step18_decrypt_file($tmp,"WrongPassphrase!2026");}catch(Throwable $e){$wrongRejected=true;}
          unlink($tmp);if(!$wrongRejected)throw new RuntimeException("Wrong passphrase was not rejected");
          echo "STEP18_CRYPTO_ROUNDTRIP=PASS\n";
          '
      - name: Commit proof marker
        run: |
          echo "STEP18_CRYPTO_ROUNDTRIP=PASS" > business/config/step18_crypto_test.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step18_crypto_test.txt
          git commit -m "STEP 18: verify AES-GCM backup crypto round trip"
          git push origin main
