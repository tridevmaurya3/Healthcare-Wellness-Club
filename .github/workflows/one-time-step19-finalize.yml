name: One-time STEP 19 finalize

on:
  push:
    paths:
      - '.github/workflows/one-time-step19-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate STEP 19 centrally
        shell: python
        run: |
          from pathlib import Path

          sec=Path('business/config/security_step17.php')
          s=sec.read_text(encoding='utf-8')
          if "require_once __DIR__.'/deployment_step19.php';" not in s:
              s=s.replace("declare(strict_types=1);\n", "declare(strict_types=1);\nrequire_once __DIR__.'/deployment_step19.php';\n", 1)
          old="$secure = (!empty($_SERVER['HTTPS']) && strtolower((string)$_SERVER['HTTPS']) !== 'off') || (int)($_SERVER['SERVER_PORT'] ?? 0) === 443;"
          new="$secure = function_exists('deployment_step19_is_https') ? deployment_step19_is_https() : ((!empty($_SERVER['HTTPS']) && strtolower((string)$_SERVER['HTTPS']) !== 'off') || (int)($_SERVER['SERVER_PORT'] ?? 0) === 443);"
          if old in s:
              s=s.replace(old,new,1)
          if "['deployment.view','Deployment: View'" not in s:
              marker="        ['backup.restore','Backup: Restore','backup','critical','Validate and execute full database restore with rollback protection.'],\n"
              block=marker+"        ['deployment.view','Deployment: View','deployment','critical','View environment, production health, releases, migration and multi-device readiness.'],\n        ['deployment.manage','Deployment: Manage','deployment','critical','Control maintenance, releases, migration plans, scheduler and offsite copy.'],\n        ['deployment.release','Production Release','deployment','critical','Authorize production release and rollback status.'],\n"
              if marker not in s: raise SystemExit('permission marker missing')
              s=s.replace(marker,block,1)
          s=s.replace("$public=['login.php','setup_admin.php','logout.php','access_denied.php'];", "$public=['login.php','setup_admin.php','logout.php','access_denied.php','maintenance.php','healthz.php'];")
          if "if($script==='step19_audit.php')return 'deployment.view';" not in s:
              marker="    if($script==='dashboard_step18.php')return 'dashboard.view';\n"
              block="    if($script==='dashboard_step19.php')return 'dashboard.view';\n    if($script==='step19_audit.php')return 'deployment.view';\n    if(in_array($script,['deployment_center.php','environment_center.php','multi_device_access.php','scheduler_center.php'],true))return 'deployment.view';\n    if($script==='production_health.php')return $write?'deployment.manage':'deployment.view';\n    if(in_array($script,['maintenance_center.php','migration_center.php','offsite_backup.php'],true))return $write?'deployment.manage':'deployment.view';\n    if($script==='deployment_releases.php')return $write?'deployment.release':'deployment.view';\n"+marker
              if marker not in s: raise SystemExit('route marker missing')
              s=s.replace(marker,block,1)
          sec.write_text(s,encoding='utf-8')

          db=Path('business/config/database.php')
          d=db.read_text(encoding='utf-8')
          if "require_once __DIR__ . '/deployment_step19.php';" not in d:
              d=d.replace("require_once __DIR__ . '/report_runtime.php';\n", "require_once __DIR__ . '/report_runtime.php';\nrequire_once __DIR__ . '/deployment_step19.php';\n",1)
          if "deployment_step19_guard_request($pdo);" not in d:
              d=d.replace("    security_step17_guard_request($pdo);\n    return $pdo;", "    security_step17_guard_request($pdo);\n    deployment_step19_guard_request($pdo);\n    return $pdo;",1)
          db.write_text(d,encoding='utf-8')

          idx=Path('business/index.php')
          idx.write_text("<?php\ndeclare(strict_types=1);\nrequire __DIR__ . '/dashboard_step19.php';\n",encoding='utf-8')

          gs=Path('business/global_search.php')
          g=gs.read_text(encoding='utf-8')
          if "['Deployment Center','cloud deployment production environment'" not in g:
              marker=" ['Today Center','today daily command followup quick activity'"
              block=" ['Deployment Center','cloud deployment production environment hosting','Production deployment and cloud readiness command center.','deployment_center.php','STEP 19'],['Environment Center','production environment secrets https host proxy','Review non-secret environment and production gates.','environment_center.php','ENV'],['Production Health','production health https database runtime probe','Run and record production health checks.','production_health.php','HEALTH'],['Release Registry','deployment release git sha version rollback','Record planned, deployed and rolled-back releases.','deployment_releases.php','RELEASE'],['Maintenance Control','maintenance mode deployment release service unavailable','Enable audited maintenance mode.','maintenance_center.php','MAINTENANCE'],['Migration Center','local cloud migration staging production encrypted backup','Plan local-to-cloud migration through verified recovery packages.','migration_center.php','MIGRATION'],['Offsite Backup','offsite cloud nas backup sha256 copy','Copy verified encrypted backups to a private mounted destination.','offsite_backup.php','OFFSITE'],['Scheduler Center','cron task scheduler backup health offsite','Production scheduler and CLI job readiness.','scheduler_center.php','SCHEDULER'],['Multi-device Access','phone pc multi device https session rbac','Secure multi-device production access readiness.','multi_device_access.php','ACCESS'],['STEP 19 Audit','step 19 cloud production deployment audit','Verify production-readiness architecture and prior data preservation.','step19_audit.php','STEP 19'],\n"
              if marker not in g: raise SystemExit('global search marker missing')
              g=g.replace(marker,block+marker,1)
          gs.write_text(g,encoding='utf-8')

      - name: PHP syntax lint
        shell: bash
        run: |
          set -e
          for f in \
            business/config/deployment_step19.php \
            business/config/security_step17.php \
            business/config/database.php \
            business/deployment_center.php \
            business/environment_center.php \
            business/production_health.php \
            business/healthz.php \
            business/deployment_releases.php \
            business/maintenance_center.php \
            business/maintenance.php \
            business/migration_center.php \
            business/offsite_backup.php \
            business/scheduler_center.php \
            business/multi_device_access.php \
            business/dashboard_step19.php \
            business/cli/deployment_step19.php \
            business/global_search.php \
            business/index.php; do
              php -l "$f"
          done

      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/security_step17.php business/config/database.php business/global_search.php business/index.php
          git commit -m "STEP 19: finalize central production guards RBAC search and dashboard" || exit 0
          git push origin main
