name: One-time STEP 14 safety

on:
  push:
    paths:
      - '.github/workflows/one-time-step14-safety.yml'

permissions:
  contents: write

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply SQL alias and explicit return-credit safety
        shell: python
        run: |
          from pathlib import Path
          service=Path('business/config/purchase_step14.php')
          text=service.read_text(encoding='utf-8')
          text=text.replace("COALESCE(x.returns,0) return_credit","COALESCE(x.return_total,0) return_credit")
          text=text.replace("SUM(CASE WHEN b.status='active' THEN b.return_credit ELSE 0 END) returns,","SUM(CASE WHEN b.status='active' THEN b.return_credit ELSE 0 END) return_total,")
          old_sig="function purchase_step14_return_received(PDO $pdo, int $receiptItemId, float $qty, string $returnDate, string $reason): int"
          new_sig="function purchase_step14_return_received(PDO $pdo, int $receiptItemId, float $qty, string $returnDate, float $creditAmount, string $reason): int"
          if old_sig in text:text=text.replace(old_sig,new_sig,1)
          old="$remaining=round((float)$ri['quantity_received']-(float)$ri['returned_quantity'],3);if($qty>$remaining+0.0005)throw new RuntimeException('Return quantity exceeds received quantity still available for return.');$credit=round($qty*(float)$ri['unit_cost'],2);"
          new="$remaining=round((float)$ri['quantity_received']-(float)$ri['returned_quantity'],3);if($qty>$remaining+0.0005)throw new RuntimeException('Return quantity exceeds received quantity still available for return.');if($creditAmount<0)throw new RuntimeException('Supplier credit note amount cannot be negative.');$credit=round($creditAmount,2);"
          if old in text:text=text.replace(old,new,1)
          service.write_text(text,encoding='utf-8')

          page=Path('business/purchase_returns.php')
          text=page.read_text(encoding='utf-8')
          old="purchase_step14_return_received($pdo,(int)$_POST['receipt_item_id'],(float)$_POST['quantity'],(string)$_POST['return_date'],(string)($_POST['reason']??''))"
          new="purchase_step14_return_received($pdo,(int)$_POST['receipt_item_id'],(float)$_POST['quantity'],(string)$_POST['return_date'],(float)($_POST['credit_amount']??0),(string)($_POST['reason']??''))"
          if old in text:text=text.replace(old,new,1)
          anchor='<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Reason>'
          repl='<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Actual Supplier Credit Note Amount<input type="number" min="0" step="0.01" name="credit_amount" required><small>Enter the actual supplier credit; it is not inferred from unit cost.</small></label><label>Reason>'
          if anchor in text:text=text.replace(anchor,repl,1)
          text=text.replace('Return credit reduces supplier payable while the original Bill and Goods Receipt stay preserved.','The actual supplier Credit Note amount reduces payable while the original Bill and Goods Receipt stay preserved.')
          page.write_text(text,encoding='utf-8')

          analytics=Path('business/purchase_analytics.php')
          text=analytics.read_text(encoding='utf-8')
          text=text.replace("SUM(return_credit) returns,SUM(paid_amount)","SUM(return_credit) return_total,SUM(paid_amount)")
          text=text.replace("$r['returns']","$r['return_total']")
          analytics.write_text(text,encoding='utf-8')
      - name: PHP lint all STEP 14 files
        run: |
          for f in business/config/purchase_step14.php business/purchase_center.php business/supplier_center.php business/supplier_detail.php business/purchase_orders.php business/purchase_bills.php business/purchase_receipts.php business/supplier_payments.php business/purchase_returns.php business/purchase_analytics.php business/purchase_export.php business/step14_audit.php business/dashboard_step14.php business/index.php business/global_search.php; do php -l "$f"; done
      - name: Commit safety patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/purchase_step14.php business/purchase_returns.php business/purchase_analytics.php
          if git diff --cached --quiet; then
            echo "Safety patch already present; lint passed."
          else
            git commit -m "STEP 14: require explicit supplier credit note and finalize SQL safety"
            git push origin main
          fi
