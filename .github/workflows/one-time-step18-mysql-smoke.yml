name: One-time STEP 18 MySQL smoke

on:
  push:
    paths:
      - '.github/workflows/one-time-step18-mysql-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: healthcare_wellness_club
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: healthcare_wellness_club
      DB_USER: root
      DB_PASS: rootpass
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install PHP MySQL extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql mysql-client >/dev/null
      - name: Prepare isolated minimal Business OS schema
        run: |
          mysql -h127.0.0.1 -uroot -prootpass healthcare_wellness_club <<'SQL'
          CREATE TABLE schema_meta (
            meta_key VARCHAR(80) PRIMARY KEY,
            meta_value VARCHAR(255) NOT NULL,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          ) ENGINE=InnoDB;
          CREATE TABLE organizations (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            organization_code VARCHAR(80) NOT NULL UNIQUE
          ) ENGINE=InnoDB;
          CREATE TABLE clubs (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            organization_id BIGINT UNSIGNED NOT NULL,
            club_code VARCHAR(80) NOT NULL,
            CONSTRAINT fk_test_club_org FOREIGN KEY (organization_id) REFERENCES organizations(id)
          ) ENGINE=InnoDB;
          CREATE TABLE system_users (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            full_name VARCHAR(150) NOT NULL,
            password_hash VARCHAR(255) NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE audit_logs (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            organization_id BIGINT UNSIGNED NULL,
            club_id BIGINT UNSIGNED NULL,
            user_id BIGINT UNSIGNED NULL,
            event_type VARCHAR(120) NOT NULL,
            entity_type VARCHAR(120) NULL,
            entity_id BIGINT UNSIGNED NULL,
            details_json LONGTEXT NULL,
            ip_address VARCHAR(64) NULL,
            user_agent VARCHAR(500) NULL,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
          ) ENGINE=InnoDB;
          CREATE TABLE demo_data (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            value_text VARCHAR(255) NOT NULL
          ) ENGINE=InnoDB;
          INSERT INTO organizations(id,organization_code) VALUES(1,'HWC-001');
          INSERT INTO clubs(id,organization_id,club_code) VALUES(1,1,'GHAZIPUR-001');
          INSERT INTO demo_data(id,value_text) VALUES(1,'ORIGINAL-BACKUP-VALUE');
          SQL
      - name: Run STEP 18 database backup restore smoke test
        shell: bash
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'business/config/database.php';
          require 'business/config/backup_step18.php';
          $pdo=business_db();
          backup_step18_ensure($pdo);
          foreach(backup_step18_support_tables() as $t){if(!business_table_exists($pdo,$t))throw new RuntimeException('Missing STEP18 table '.$t);}
          $pass='SmokeTest!BackupPass2026';
          $created=backup_step18_create_backup($pdo,$pass,'manual','Isolated GitHub smoke test',null);
          $verified=backup_step18_verify_record($pdo,(int)$created['id'],$pass,null);
          if($verified['status']!=='verified')throw new RuntimeException('Verification did not pass: '.$verified['detail']);
          $record=backup_step18_record($pdo,1,(int)$created['id']);
          $stage=backup_step18_stage_path($pdo,backup_step18_resolve_path((string)$record['storage_path']),(string)$record['stored_name'],$pass,null,(int)$record['id']);
          if($stage['validation_status']!=='valid')throw new RuntimeException('Restore preview schema validation failed');
          $decoded=backup_step18_decrypt_file(backup_step18_resolve_path((string)$record['storage_path']),$pass,(string)$record['file_sha256']);
          $pdo->exec("UPDATE demo_data SET value_text='CHANGED-AFTER-BACKUP' WHERE id=1");
          backup_step18_apply_payload($pdo,$decoded['payload']);
          $value=(string)$pdo->query('SELECT value_text FROM demo_data WHERE id=1')->fetchColumn();
          if($value!=='ORIGINAL-BACKUP-VALUE')throw new RuntimeException('Core restore did not recover original data');
          $hash=hash_file('sha256',backup_step18_resolve_path((string)$record['storage_path']));
          if(!hash_equals((string)$record['file_sha256'],$hash))throw new RuntimeException('Stored package SHA mismatch');
          echo "STEP18_MYSQL_BACKUP_RESTORE_SMOKE=PASS\n";
          PHP
      - name: Commit smoke proof
        run: |
          echo "STEP18_MYSQL_BACKUP_RESTORE_SMOKE=PASS" > business/config/step18_mysql_smoke.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step18_mysql_smoke.txt
          git commit -m "STEP 18: pass isolated MySQL backup restore smoke test"
          git push origin main
