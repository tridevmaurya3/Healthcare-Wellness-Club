name: One-time STEP 18 lint

on:
  push:
    paths:
      - '.github/workflows/one-time-step18-lint.yml'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture STEP 18 PHP lint
        shell: bash
        run: |
          set +e
          report="business/config/step18_lint_report.txt"
          : > "$report"
          fail=0
          for f in \
            business/config/backup_step18.php \
            business/backup_center.php \
            business/backup_create.php \
            business/backup_history.php \
            business/backup_download.php \
            business/backup_restore.php \
            business/backup_policy.php \
            business/disaster_recovery.php \
            business/cloud_readiness.php \
            business/step18_audit.php \
            business/dashboard_step18.php \
            business/cli/backup_step18.php \
            business/index.php; do
              echo "### $f" >> "$report"
              php -l "$f" >> "$report" 2>&1
              code=$?
              if [ $code -ne 0 ]; then fail=1; fi
            done
          echo "FINAL_LINT_STATUS=$fail" >> "$report"
          exit 0
      - name: Commit lint report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step18_lint_report.txt
          git commit -m "STEP 18: capture PHP lint report"
          git push origin main
