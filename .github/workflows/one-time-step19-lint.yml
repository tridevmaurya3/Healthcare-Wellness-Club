name: One-time STEP 19 lint

on:
  push:
    paths:
      - '.github/workflows/one-time-step19-lint.yml'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture STEP 19 diagnostics
        shell: bash
        run: |
          set +e
          report="business/config/step19_lint_report.txt"
          : > "$report"
          fail=0
          for f in \
            business/config/deployment_step19.php \
            business/config/security_step17.php \
            business/config/database.php \
            business/deployment_center.php \
            business/environment_center.php \
            business/production_health.php \
            business/healthz.php \
            business/deployment_releases.php \
            business/maintenance_center.php \
            business/maintenance.php \
            business/migration_center.php \
            business/offsite_backup.php \
            business/scheduler_center.php \
            business/multi_device_access.php \
            business/step19_audit.php \
            business/dashboard_step19.php \
            business/cli/deployment_step19.php \
            business/global_search.php \
            business/index.php; do
              echo "### $f" >> "$report"
              php -l "$f" >> "$report" 2>&1
              [ $? -eq 0 ] || fail=1
          done
          php <<'PHP' >> "$report" 2>&1
          <?php
          require 'business/config/deployment_step19.php';
          putenv('HWC_APP_ENV=production');putenv('HWC_ALLOWED_HOSTS=example.test');putenv('HWC_TRUSTED_PROXIES=10.0.0.10');
          $_SERVER['HTTP_HOST']='example.test';$_SERVER['REMOTE_ADDR']='203.0.113.5';$_SERVER['HTTPS']='off';$_SERVER['SERVER_PORT']='80';$_SERVER['HTTP_X_FORWARDED_PROTO']='https';
          if(deployment_step19_is_https())throw new RuntimeException('Untrusted proxy header was accepted');
          $_SERVER['REMOTE_ADDR']='10.0.0.10';if(!deployment_step19_is_https())throw new RuntimeException('Trusted proxy HTTPS header was rejected');
          if(!deployment_step19_host_allowed('example.test')||deployment_step19_host_allowed('evil.test'))throw new RuntimeException('Host allowlist failed');
          echo "STEP19_HELPER_TEST=PASS\n";
          PHP
          helper=$?
          [ $helper -eq 0 ] || fail=1
          echo "FINAL_LINT_STATUS=$fail" >> "$report"
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step19_lint_report.txt
          git commit -m "STEP 19: capture final lint diagnostic"
          git push origin main
