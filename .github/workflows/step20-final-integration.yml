name: STEP 20 final integration
on:
  push:
    paths:
      - '.github/workflows/step20-final-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch STEP 20 integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('business/config/lead_step20.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("VALUES(?,?,'stage_change','Lead stage updated',?,?,?,?,?)", "VALUES(?,?,'stage_change','Lead stage updated',?,?,?,?)")
          p.write_text(s,encoding='utf-8')

          p=Path('business/config/security_step17.php')
          s=p.read_text(encoding='utf-8')
          marker="        ['deployment.view','Deployment: View'"
          if "['leads.view'" not in s:
              insert="        ['leads.view','Public Leads: View','leads','sensitive','View public website leads, follow-ups, appointments and lead analytics.'],\n        ['leads.manage','Public Leads: Manage','leads','sensitive','Manage lead stages, assignment, follow-ups, appointments and explicit conversions.'],\n"
              s=s.replace(marker,insert+marker,1)
          s=s.replace("'customers.view','customers.manage','finance.view','audit.view',", "'customers.view','customers.manage','leads.view','leads.manage','finance.view','audit.view',")
          s=s.replace("'purchases.view','purchases.manage','customers.view','customers.manage',", "'purchases.view','purchases.manage','customers.view','customers.manage','leads.view','leads.manage',")
          route="    if(str_starts_with($script,'lead_')||$script==='step20_audit.php')return $write?'leads.manage':'leads.view';\n"
          if "step20_audit.php')return" not in s:
              s=s.replace("    if($script==='dashboard_step19.php')return 'dashboard.view';",route+"    if($script==='dashboard_step20.php')return 'dashboard.view';\n    if($script==='dashboard_step19.php')return 'dashboard.view';",1)
          if "'public_lead_submit.php'" not in s:
              s=s.replace("'maintenance.php','healthz.php'", "'maintenance.php','healthz.php','public_lead_submit.php'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('business/index.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("dashboard_step19.php","dashboard_step20.php")
          p.write_text(s,encoding='utf-8')

          p=Path('business/global_search.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("['all','product','member','order','vp','renewal','income','royalty','tool','report']", "['all','product','lead','member','order','vp','renewal','income','royalty','tool','report']")
          tool_marker=" ['Today Center','today daily command followup quick activity'"
          if "['Lead Center'" not in s:
              lead_tools=" ['Lead Center','lead crm website enquiry contact wellness join appointment product','Website enquiries, stages and conversion pipeline.','lead_center.php','LEADS'],['Lead Follow-ups','lead followup call whatsapp visit email overdue','Due and overdue lead action queue.','lead_followups.php','FOLLOW-UP'],['Lead Appointments','lead appointment calendar scheduled request','Confirmed appointment queue from public leads.','lead_appointments.php','APPOINTMENT'],['Lead Analytics','lead analytics conversion source stage enquiry','Website lead and conversion analytics.','lead_analytics.php','ANALYTICS'],['STEP 20 Audit','step 20 public website lead crm audit','Verify Public Website to Business OS Lead CRM.','step20_audit.php','STEP 20'],\n"
              s=s.replace(tool_marker,lead_tools+tool_marker,1)
          query_marker="  if(($scope==='all'||$scope==='member')&&security_step17_has_permission($pdo,'members.view',$gsUser))"
          if "scope==='lead'" not in s:
              lead_query="  if(($scope==='all'||$scope==='lead')&&security_step17_has_permission($pdo,'leads.view',$gsUser)&&business_table_exists($pdo,'crm_leads')){$stmt=$pdo->prepare(\"SELECT id,lead_code,full_name,mobile,email,stage,lead_type FROM crm_leads WHERE organization_id=? AND (lead_code LIKE ? OR full_name LIKE ? OR COALESCE(mobile,'') LIKE ? OR COALESCE(email,'') LIKE ?) ORDER BY id DESC LIMIT 18\");$stmt->execute([$organizationId,$like,$like,$like,$like]);foreach($stmt->fetchAll() as $r){$results[]=['type'=>'lead','title'=>$r['lead_code'].' • '.$r['full_name'],'subtitle'=>strtoupper($r['lead_type']).' • '.strtoupper($r['stage']).' • '.($r['mobile']?:$r['email']),'value'=>'Lead #'.(int)$r['id'],'url'=>'lead_detail.php?id='.(int)$r['id'],'badge'=>'LEAD'];$counts['lead']++;}}\n"
              s=s.replace(query_marker,lead_query+query_marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: PHP lint
        run: |
          set -e
          for f in \
            business/config/lead_step20.php \
            business/public_lead_submit.php \
            business/lead_center.php \
            business/lead_detail.php \
            business/lead_followups.php \
            business/lead_appointments.php \
            business/lead_analytics.php \
            business/lead_export.php \
            business/dashboard_step20.php \
            business/config/security_step17.php \
            business/global_search.php \
            business/index.php; do
            php -l "$f"
          done
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/lead_step20.php business/config/security_step17.php business/global_search.php business/index.php
          git diff --cached --quiet && exit 0
          git commit -m "STEP 20: finalize RBAC search dashboard and public endpoint integration"
          git push origin HEAD:main