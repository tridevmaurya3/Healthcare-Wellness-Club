name: STEP 21 final integration
on:
  push:
    paths:
      - '.github/workflows/step21-final-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply STEP 21 integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Communications engine: quiet hours, idempotent queue and auto-external to internal users only.
          p=Path('business/config/communications_step21.php')
          s=p.read_text(encoding='utf-8')
          marker="function comm_step21_resolve_missing(PDO $pdo,int $orgId,string $eventType,array $activeKeys): void\n"
          if 'function comm_step21_quiet_schedule' not in s:
              helper=r'''function comm_step21_quiet_schedule(array $pref): string
{
    $tzName=(string)($pref['timezone_name']??'Asia/Kolkata');try{$tz=new DateTimeZone($tzName);}catch(Throwable){$tz=new DateTimeZone('Asia/Kolkata');}
    $now=new DateTimeImmutable('now',$tz);$qs=substr((string)($pref['quiet_start']??''),0,5);$qe=substr((string)($pref['quiet_end']??''),0,5);
    if(!preg_match('/^\d{2}:\d{2}$/',$qs)||!preg_match('/^\d{2}:\d{2}$/',$qe)||$qs===$qe)return date('Y-m-d H:i:s',$now->getTimestamp());
    $today=$now->format('Y-m-d');$start=new DateTimeImmutable($today.' '.$qs,$tz);$end=new DateTimeImmutable($today.' '.$qe,$tz);
    if($start<$end){$inside=$now>=$start&&$now<$end;$target=$end;}
    else{$inside=$now>=$start||$now<$end;if($now>=$start)$target=$end->modify('+1 day');else$target=$end;}
    return date('Y-m-d H:i:s',($inside?$target:$now)->getTimestamp());
}

function comm_step21_auto_external_for_event(PDO $pdo,int $orgId,int $eventId,array $rule,string $title,string $body): void
{
    if((int)($rule['auto_external']??0)!==1)return;
    $permission=(string)$rule['audience_permission'];
    foreach(comm_step21_active_users($pdo,$orgId,$permission) as $u){
        $pref=comm_step21_user_pref($pdo,$orgId,(int)$u['id']);$scheduled=comm_step21_quiet_schedule($pref);
        foreach(['email','whatsapp','sms'] as $channel){
            $ruleKey=$channel.'_enabled';$prefKey=$channel.'_enabled';if((int)($rule[$ruleKey]??0)!==1||(int)($pref[$prefKey]??0)!==1)continue;
            try{comm_step21_queue($pdo,$orgId,'user',(int)$u['id'],$channel,'GENERAL_FOLLOWUP',['message'=>$title.' — '.$body,'reference'=>'Business OS notification','date'=>date('d M Y H:i'),'amount'=>''],null,$scheduled,$eventId,'event-'.$eventId.'-user-'.$u['id'].'-'.$channel);}catch(RuntimeException $e){if(!str_contains(strtolower($e->getMessage()),'valid email')&&!str_contains(strtolower($e->getMessage()),'valid mobile'))throw $e;}
        }
    }
}

'''
              s=s.replace(marker,helper+marker,1)
          old="    return $eventId;\n}\n\nfunction comm_step21_resolve_missing"
          if old in s and 'comm_step21_auto_external_for_event($pdo,$orgId,$eventId,$rule,$title,$body);' not in s:
              s=s.replace("    return $eventId;\n}\n\nfunction comm_step21_resolve_missing","    if($eventId>0&&$rule)comm_step21_auto_external_for_event($pdo,$orgId,$eventId,$rule,$title,$body);\n    return $eventId;\n}\n\nfunction comm_step21_resolve_missing",1)
          old_exec="$s=$pdo->prepare(\"INSERT INTO communication_outbox(organization_id,event_id,template_id,idempotency_key,channel,recipient_type,recipient_id,recipient_name_snapshot,recipient_address_snapshot,subject_snapshot,body_snapshot,status,provider_mode,scheduled_at,created_by) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\");$s->execute([$orgId,$eventId,(int)$tpl['id'],$idem,$channel,$recipientType,$recipientId,$recipient['name'],$recipient['address'],$subject,$body,$status,$mode,$when,$actor]);return(int)$pdo->lastInsertId();"
          new_exec="$s=$pdo->prepare(\"INSERT IGNORE INTO communication_outbox(organization_id,event_id,template_id,idempotency_key,channel,recipient_type,recipient_id,recipient_name_snapshot,recipient_address_snapshot,subject_snapshot,body_snapshot,status,provider_mode,scheduled_at,created_by) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\");$s->execute([$orgId,$eventId,(int)$tpl['id'],$idem,$channel,$recipientType,$recipientId,$recipient['name'],$recipient['address'],$subject,$body,$status,$mode,$when,$actor]);$id=(int)$pdo->lastInsertId();if($id>0)return $id;$q=$pdo->prepare(\"SELECT id FROM communication_outbox WHERE organization_id=? AND idempotency_key=? LIMIT 1\");$q->execute([$orgId,$idem]);$id=(int)$q->fetchColumn();if($id<=0)throw new RuntimeException('Communication could not be queued.');return $id;"
          if old_exec in s:s=s.replace(old_exec,new_exec,1)
          p.write_text(s,encoding='utf-8')

          # Avoid mbstring dependency in Outbox preview.
          p=Path('business/communication_outbox.php');s=p.read_text(encoding='utf-8')
          s=s.replace("mb_strlen((string)$r['body_snapshot'])>180?mb_substr((string)$r['body_snapshot'],0,180).'…':$r['body_snapshot']","strlen((string)$r['body_snapshot'])>180?substr((string)$r['body_snapshot'],0,180).'…':$r['body_snapshot']")
          p.write_text(s,encoding='utf-8')

          # RBAC permissions and routes.
          p=Path('business/config/security_step17.php');s=p.read_text(encoding='utf-8')
          marker="        ['deployment.view','Deployment: View'"
          if "['communications.view'" not in s:
              ins="        ['communications.view','Communications: View','communications','sensitive','View notifications, communication history, analytics and export.'],\n        ['communications.send','Communications: Send','communications','sensitive','Compose, queue, retry and confirm outbound communications.'],\n        ['communications.manage','Communications: Manage','communications','critical','Manage templates, rules and provider-neutral channel settings.'],\n"
              s=s.replace(marker,ins+marker,1)
          # Role defaults: Manager/Staff can view/send; only Admin gets manage via immutable full-access.
          s=s.replace("'customers.view','customers.manage','leads.view','leads.manage','finance.view','audit.view',","'customers.view','customers.manage','leads.view','leads.manage','communications.view','communications.send','finance.view','audit.view',")
          s=s.replace("'purchases.view','purchases.manage','customers.view','customers.manage','leads.view','leads.manage',","'purchases.view','purchases.manage','customers.view','customers.manage','leads.view','leads.manage','communications.view','communications.send',")
          route="    if(in_array($script,['notification_inbox.php','notification_preferences.php'],true))return 'dashboard.view';\n    if(in_array($script,['communication_compose.php','communication_outbox.php'],true))return 'communications.send';\n    if(in_array($script,['communication_templates.php','communication_rules.php','communication_settings.php'],true))return 'communications.manage';\n    if(in_array($script,['communication_center.php','communication_history.php','communication_analytics.php','communication_export.php','step21_audit.php'],true))return 'communications.view';\n    if($script==='dashboard_step21.php')return 'dashboard.view';\n"
          if "step21_audit.php'],true))return 'communications.view'" not in s:
              s=s.replace("    if(str_starts_with($script,'lead_')||$script==='step20_audit.php')return $write?'leads.manage':'leads.view';",route+"    if(str_starts_with($script,'lead_')||$script==='step20_audit.php')return $write?'leads.manage':'leads.view';",1)
          p.write_text(s,encoding='utf-8')

          # Main dashboard route.
          p=Path('business/index.php');s=p.read_text(encoding='utf-8').replace('dashboard_step20.php','dashboard_step21.php');p.write_text(s,encoding='utf-8')

          # Global Search: communications scope and permission-aware tools/data.
          p=Path('business/global_search.php');s=p.read_text(encoding='utf-8')
          s=s.replace("['all','product','lead','member','order','vp','renewal','income','royalty','tool','report']","['all','product','lead','communication','member','order','vp','renewal','income','royalty','tool','report']")
          lead_marker=" ['Lead Center','lead crm website enquiry contact wellness join appointment product'"
          if "['Communication Center'" not in s:
              tools=" ['Communication Center','communication notification inbox email whatsapp sms outbox alerts','Role-aware events, notifications and outbound communication.','communication_center.php','STEP 21'],['My Notifications','notification inbox unread alert','Signed-in user notification inbox.','notification_inbox.php','INBOX'],['Communication Compose','compose email whatsapp sms lead customer supplier','Queue a traceable external communication.','communication_compose.php','COMPOSE'],['Communication Outbox','communication outbox queued manual provider retry failed','External delivery lifecycle and retry evidence.','communication_outbox.php','OUTBOX'],['Communication Analytics','communication analytics events sent failed delivery','Notification and delivery analytics.','communication_analytics.php','ANALYTICS'],['STEP 21 Audit','step 21 communications notifications audit','Verify Communications & Notifications integrity.','step21_audit.php','STEP 21'],\n"
              s=s.replace(lead_marker,tools+lead_marker,1)
          qmarker="  if(($scope==='all'||$scope==='lead')&&security_step17_has_permission($pdo,'leads.view',$gsUser)"
          if "scope==='communication'" not in s:
              commq="  if(($scope==='all'||$scope==='communication')&&security_step17_has_permission($pdo,'communications.view',$gsUser)&&business_table_exists($pdo,'communication_outbox')){$stmt=$pdo->prepare(\"SELECT id,channel,recipient_name_snapshot,recipient_address_snapshot,subject_snapshot,status FROM communication_outbox WHERE organization_id=? AND (CAST(id AS CHAR) LIKE ? OR recipient_name_snapshot LIKE ? OR recipient_address_snapshot LIKE ? OR COALESCE(subject_snapshot,'') LIKE ? OR channel LIKE ? OR status LIKE ?) ORDER BY id DESC LIMIT 18\");$stmt->execute([$organizationId,$like,$like,$like,$like,$like,$like]);foreach($stmt->fetchAll() as $r){$results[]=['type'=>'communication','title'=>'Outbox #'.(int)$r['id'].' • '.strtoupper($r['channel']),'subtitle'=>$r['recipient_name_snapshot'].' • '.strtoupper(str_replace('_',' ',$r['status'])),'value'=>$r['subject_snapshot']?:$r['recipient_address_snapshot'],'url'=>'communication_outbox.php','badge'=>'COMM'];$counts['communication']++;}}\n"
              s=s.replace(qmarker,commq+qmarker,1)
          s=s.replace("['product'=>'Products','member'=>'Members'","['product'=>'Products','lead'=>'Leads','communication'=>'Communications','member'=>'Members'")
          p.write_text(s,encoding='utf-8')

          # Server-only environment variable names; no real secrets.
          p=Path('.env.example');s=p.read_text(encoding='utf-8')
          if 'HWC_COMM_EMAIL_WEBHOOK_URL' not in s:
              s += "\n# STEP 21 provider-neutral communication relay. Keep real values on the server only.\nHWC_COMM_EMAIL_WEBHOOK_URL=\nHWC_COMM_EMAIL_WEBHOOK_TOKEN=\nHWC_COMM_WHATSAPP_WEBHOOK_URL=\nHWC_COMM_WHATSAPP_WEBHOOK_TOKEN=\nHWC_COMM_SMS_WEBHOOK_URL=\nHWC_COMM_SMS_WEBHOOK_TOKEN=\n"
          p.write_text(s,encoding='utf-8')

          # Prior closed audits remain valid as later dashboards are introduced.
          for path in ['business/step17_audit.php','business/step18_audit.php','business/step19_audit.php','business/step20_audit.php']:
              p=Path(path);s=p.read_text(encoding='utf-8')
              if 'dashboard_step21.php' not in s:
                  if path.endswith('step17_audit.php'):
                      s=s.replace("str_contains($indexFile,'dashboard_step20.php')","str_contains($indexFile,'dashboard_step20.php')||str_contains($indexFile,'dashboard_step21.php')")
                  elif path.endswith('step18_audit.php'):
                      s=s.replace("str_contains($index,'dashboard_step20.php')","str_contains($index,'dashboard_step20.php')||str_contains($index,'dashboard_step21.php')")
                  elif path.endswith('step19_audit.php'):
                      s=s.replace("str_contains($index,'dashboard_step20.php')","str_contains($index,'dashboard_step20.php')||str_contains($index,'dashboard_step21.php')")
                  else:
                      s=s.replace("$index20=str_contains($index,'dashboard_step20.php');","$index20=str_contains($index,'dashboard_step20.php')||str_contains($index,'dashboard_step21.php');")
              p.write_text(s,encoding='utf-8')
          PY
      - name: PHP lint STEP 21 and integrations
        run: |
          set -e
          for f in \
            business/config/communications_step21.php \
            business/communication_center.php \
            business/notification_inbox.php \
            business/notification_preferences.php \
            business/communication_compose.php \
            business/communication_outbox.php \
            business/communication_templates.php \
            business/communication_rules.php \
            business/communication_settings.php \
            business/communication_history.php \
            business/communication_analytics.php \
            business/communication_export.php \
            business/cli/communications_step21.php \
            business/dashboard_step21.php \
            business/config/security_step17.php \
            business/global_search.php \
            business/index.php \
            business/step17_audit.php \
            business/step18_audit.php \
            business/step19_audit.php \
            business/step20_audit.php; do php -l "$f"; done
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/communications_step21.php business/communication_outbox.php business/config/security_step17.php business/index.php business/global_search.php .env.example business/step17_audit.php business/step18_audit.php business/step19_audit.php business/step20_audit.php
          git diff --cached --quiet && exit 0
          git commit -m "STEP 21: finalize RBAC automation search and dashboard integration"
          git push origin HEAD:main
