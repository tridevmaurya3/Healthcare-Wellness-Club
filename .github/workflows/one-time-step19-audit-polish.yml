name: One-time STEP 19 audit polish

on:
  push:
    paths:
      - '.github/workflows/one-time-step19-audit-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make final audit checks wording-independent
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/step19_audit.php')
          s=p.read_text(encoding='utf-8')
          old="$migrationGate=str_contains($service,\"verification_status='verified'\")&&str_contains($migration,'Restore Preview');"
          new="$migrationGate=str_contains($service,\"verification_status='verified'\")&&str_contains(strtolower($migration),'restore preview')&&str_contains($migration,'backup_id');"
          if old not in s: raise SystemExit('migration gate marker missing')
          s=s.replace(old,new,1)
          old="$runbookOk=str_contains($runbook,'HWC_APP_ENV=production')&&str_contains($runbook,'verified STEP 18 backup');"
          new="$runbookOk=str_contains($runbook,'HWC_APP_ENV=production')&&str_contains(strtolower($runbook),'step 18 backup')&&str_contains(strtolower($runbook),'migration center')&&str_contains(strtolower($runbook),'production health');"
          if old not in s: raise SystemExit('runbook marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Lint
        run: php -l business/step19_audit.php
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/step19_audit.php
          git commit -m "STEP 19: make final audit capability checks wording-independent"
          git push origin main
