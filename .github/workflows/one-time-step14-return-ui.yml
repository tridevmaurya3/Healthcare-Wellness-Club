name: One-time STEP 14 return UI fix

on:
  push:
    paths:
      - '.github/workflows/one-time-step14-return-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add explicit supplier credit note field
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/purchase_returns.php')
          text=p.read_text(encoding='utf-8')
          if 'name="credit_amount"' not in text:
              needle='<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Reason>'
              replacement='<label>Return Date<input type="date" name="return_date" value="<?= date(\'Y-m-d\') ?>" required></label><label>Actual Supplier Credit Note Amount<input type="number" min="0" step="0.01" name="credit_amount" required><small>Enter the actual supplier credit amount; the system will not infer it from unit cost.</small></label><label>Reason>'
              if needle not in text:
                  raise SystemExit('Return Date -> Reason anchor not found')
              text=text.replace(needle,replacement,1)
              p.write_text(text,encoding='utf-8')
      - name: PHP lint
        run: |
          php -l business/purchase_returns.php
          php -l business/config/purchase_step14.php
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/purchase_returns.php
          git commit -m "STEP 14: add explicit supplier credit note field to return form"
          git push origin main
