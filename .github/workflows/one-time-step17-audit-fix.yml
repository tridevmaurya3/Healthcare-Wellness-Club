name: One-time STEP 17 audit fix

on:
  push:
    paths:
      - '.github/workflows/one-time-step17-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix STEP 17 audit literal check
        shell: python
        run: |
          from pathlib import Path
          p = Path('business/step17_audit.php')
          s = p.read_text(encoding='utf-8')
          old = 'str_contains($securityFile,"str_starts_with($script,\'finance_\')")'
          new = 'str_contains($securityFile,"str_starts_with(\\$script,\'finance_\')")'
          if old not in s:
              raise SystemExit('Expected STEP 17 finance guard audit expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: PHP syntax lint
        run: php -l business/step17_audit.php

      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/step17_audit.php
          git commit -m "STEP 17: fix audit literal variable warning"
          git push origin main
