name: One-time STEP 19 cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-step19-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary STEP 19 validation artifacts
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/one-time-step19-finalize.yml \
            .github/workflows/one-time-step19-validation.yml \
            .github/workflows/one-time-step19-lint.yml \
            .github/workflows/one-time-step19-https-preflight.yml \
            .github/workflows/one-time-step19-sql-diagnostic.yml \
            .github/workflows/one-time-step19-backward-audits.yml \
            .github/workflows/one-time-step19-backward-audits-v2.yml \
            .github/workflows/one-time-step19-audit-polish.yml \
            .github/workflows/one-time-step19-cleanup.yml \
            business/config/step19_lint_report.txt \
            business/config/step19_sql_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary STEP 19 validation artifacts"
          git push origin main
