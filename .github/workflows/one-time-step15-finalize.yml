name: One-time STEP 15 finalize

on:
  push:
    paths:
      - '.github/workflows/one-time-step15-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate Product Sales with STEP 15
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/product_sales_center_core.php')
          t=p.read_text(encoding='utf-8')
          t=t.replace("require_once __DIR__ . '/config/product_step12_bridge.php';","require_once __DIR__ . '/config/sales_step15.php';")
          t=t.replace('product_step12_bridge_finalize($pdo,$quoteId,$memberId,$orderDate)','sales_step15_finalize_quote($pdo,$quoteId,$memberId,$orderDate)')
          t=t.replace('product_step12_bridge_cancel($pdo,$orderId,trim((string)($_POST[\'reason\']??\'\')))','sales_step15_cancel_sale($pdo,$orderId,trim((string)($_POST[\'reason\']??\'\')))')
          t=t.replace('product_step12_bridge_restore($pdo,$orderId,trim((string)($_POST[\'reason\']??\'\')))','sales_step15_restore_sale($pdo,$orderId,trim((string)($_POST[\'reason\']??\'\')))')
          t=t.replace('<small>STEP 12 • Product Sales Business Integration</small>','<small>STEP 12 + 15 • Product Sales → Customer Fulfillment</small>')
          if 'href="sales_fulfillment.php">Fulfillment</a>' not in t:
              t=t.replace('<a class="os-btn" href="product_sales_analytics.php">Analytics</a>','<a class="os-btn" href="product_sales_analytics.php">Analytics</a><a class="os-btn" href="sales_fulfillment.php">Fulfillment</a>')
          p.write_text(t,encoding='utf-8')

      - name: Add invoice lifecycle safety
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/config/sales_step15.php')
          t=p.read_text(encoding='utf-8')
          old="sales_step15_assert_cancellable($pdo,$orderId);product_step12_bridge_cancel($pdo,$orderId,$reason);if(business_table_exists($pdo,'sales_fulfillment_ledger'))sales_step15_sync_ledger($pdo,$orderId);"
          new="sales_step15_assert_cancellable($pdo,$orderId);product_step12_bridge_cancel($pdo,$orderId,$reason);if(business_table_exists($pdo,'sales_invoices'))$pdo->prepare(\"UPDATE sales_invoices SET status='cancelled' WHERE organization_id=? AND order_id=?\")->execute([(int)product_step12_context($pdo)['organization_id'],$orderId]);if(business_table_exists($pdo,'sales_fulfillment_ledger'))sales_step15_sync_ledger($pdo,$orderId);"
          if old in t: t=t.replace(old,new,1)
          old2="product_step12_bridge_restore($pdo,$orderId,$reason);sales_step15_ensure($pdo);sales_step15_backfill($pdo);sales_step15_sync_ledger($pdo,$orderId);"
          new2="product_step12_bridge_restore($pdo,$orderId,$reason);sales_step15_ensure($pdo);$pdo->prepare(\"UPDATE sales_invoices SET status='active' WHERE organization_id=? AND order_id=?\")->execute([(int)product_step12_context($pdo)['organization_id'],$orderId]);sales_step15_backfill($pdo);sales_step15_sync_ledger($pdo,$orderId);"
          if old2 in t: t=t.replace(old2,new2,1)
          p.write_text(t,encoding='utf-8')

      - name: Add STEP 15 commands to Global Search
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/global_search.php')
          t=p.read_text(encoding='utf-8')
          if "['Customer Center','customer crm customer master" not in t:
              anchor="['STEP 14 Purchase Audit','step 14 purchase supplier audit','Verify the complete Purchase & Supplier system.','step14_audit.php','STEP 14'],"
              add=anchor+"\n ['Customer Center','customer crm customer master contact address','Customer Master and Customer 360 workspace.','customer_center.php','CRM'],['Sales Fulfillment','sales fulfillment invoice delivery return refund receivable','Customer after-sales command center.','sales_fulfillment.php','FULFILL'],['Sales Invoices','sales invoice print pdf customer invoice','Immutable original Product Sale invoices.','sales_invoice.php','INVOICE'],['Sales Delivery','delivery dispatch courier tracking delivered','Dispatch and delivery tracking.','sales_delivery.php','DELIVERY'],['Customer Returns','customer return credit note batch stock','Batch-specific customer returns and credit notes.','sales_returns.php','RETURN'],['Customer Refunds','customer refund payment credit note','Audited customer refund workflow.','sales_refunds.php','REFUND'],['Customer Receivables','customer receivable outstanding credit due','Post-return customer balance ledger.','sales_receivables.php','RECEIVABLE'],['CRM Follow-ups','crm followup call whatsapp visit support','Customer follow-up action queue.','crm_followups.php','FOLLOW-UP'],['STEP 15 Analytics','customer fulfillment analytics returns refunds','Customer and fulfillment analytics.','sales_analytics_step15.php','ANALYTICS'],['STEP 15 Audit','step 15 customer crm fulfillment audit','Verify Customer CRM and after-sales integrity.','step15_audit.php','STEP 15'],"
              if anchor not in t: raise SystemExit('STEP 14 anchor not found')
              t=t.replace(anchor,add,1)
          p.write_text(t,encoding='utf-8')

      - name: PHP syntax check STEP 15
        run: |
          php -l business/config/sales_step15.php
          php -l business/customer_center.php
          php -l business/customer_detail.php
          php -l business/sales_fulfillment.php
          php -l business/sales_invoice.php
          php -l business/sales_delivery.php
          php -l business/sales_returns.php
          php -l business/sales_refunds.php
          php -l business/sales_receivables.php
          php -l business/crm_followups.php
          php -l business/sales_analytics_step15.php
          php -l business/sales_export_step15.php
          php -l business/step15_audit.php
          php -l business/dashboard_step15.php
          php -l business/product_sales_center_core.php
          php -l business/global_search.php
          php -l business/index.php

      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/sales_step15.php business/product_sales_center_core.php business/global_search.php
          if git diff --cached --quiet; then
            echo "Lint passed; no integration patch required."
          else
            git commit -m "STEP 15: finalize customer CRM fulfillment integration"
            git push origin main
          fi