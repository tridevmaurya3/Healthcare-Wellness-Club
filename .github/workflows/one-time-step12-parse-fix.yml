name: One-time STEP 12 parse fix

on:
  push:
    paths:
      - '.github/workflows/one-time-step12-parse-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch the missing closing bracket
        shell: python
        run: |
          from pathlib import Path
          path = Path('business/config/product_step12.php')
          text = path.read_text(encoding='utf-8')
          old = "product_step12_json(['quote_id'=>(int)$quote['id'],'order_date'=>$orderDate,'member_id'=>$memberId,'net_amount'=>$net,'vp'=>(float)$quote['total_vp'])]);"
          new = "product_step12_json(['quote_id'=>(int)$quote['id'],'order_date'=>$orderDate,'member_id'=>$memberId,'net_amount'=>$net,'vp'=>(float)$quote['total_vp']])]);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one broken lifecycle expression, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: PHP syntax check
        run: php -l business/config/product_step12.php

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/product_step12.php
          git commit -m "Fix STEP 12 product service parse error"
          git push origin main
