name: Fix STEP 19 audit dbUser literal
on:
  push:
    paths:
      - '.github/workflows/fix-step19-audit-dbuser.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch audit literal and lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('business/step19_audit.php')
          s=p.read_text(encoding='utf-8')
          old='str_contains($service,"strtolower($dbUser)!==\'root\'")'
          new='str_contains($service,"strtolower(\\$dbUser)!==\'root\'")'
          if old not in s:
              raise SystemExit('Expected STEP 19 audit pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l business/step19_audit.php
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/step19_audit.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix STEP 19 audit dbUser literal warning"
          git push origin HEAD:main
