name: One-time STEP 19 SQL diagnostic

on:
  push:
    paths:
      - '.github/workflows/one-time-step19-sql-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: healthcare_wellness_club
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture migration diagnostic
        shell: bash
        run: |
          set +e
          report="business/config/step19_sql_diagnostic.txt"
          : > "$report"
          sudo apt-get update -qq >> "$report" 2>&1
          sudo apt-get install -y php-mysql mysql-client >> "$report" 2>&1
          echo "PDO_MYSQL=$(php -m | grep -ci '^pdo_mysql$')" >> "$report"
          mysqladmin -h127.0.0.1 -uroot ping >> "$report" 2>&1
          echo "MYSQL_PING_EXIT=$?" >> "$report"
          mysql -h127.0.0.1 -uroot healthcare_wellness_club >> "$report" 2>&1 <<'SQL'
          CREATE TABLE organizations (id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,organization_code VARCHAR(80) NOT NULL UNIQUE) ENGINE=InnoDB;
          CREATE TABLE clubs (id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,organization_id BIGINT UNSIGNED NOT NULL,club_code VARCHAR(80) NOT NULL) ENGINE=InnoDB;
          CREATE TABLE system_users (id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,full_name VARCHAR(150) NOT NULL) ENGINE=InnoDB;
          CREATE TABLE backup_records (id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,organization_id BIGINT UNSIGNED NOT NULL,verification_status VARCHAR(32) NOT NULL DEFAULT 'pending',status VARCHAR(32) NOT NULL DEFAULT 'created') ENGINE=InnoDB;
          INSERT INTO organizations(id,organization_code) VALUES(1,'HWC-001');
          INSERT INTO clubs(id,organization_id,club_code) VALUES(1,1,'GHAZIPUR-001');
          SQL
          echo "PREREQ_EXIT=$?" >> "$report"
          php >> "$report" 2>&1 <<'PHP'
          <?php
          declare(strict_types=1);
          require 'business/config/deployment_step19.php';
          function business_table_exists(PDO $pdo,string $table):bool{$s=$pdo->prepare('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?');$s->execute([$table]);return(int)$s->fetchColumn()>0;}
          try{
            $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=healthcare_wellness_club;charset=utf8mb4','root','',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
            deployment_step19_ensure($pdo);
            foreach(deployment_step19_support_tables() as $t){if(!business_table_exists($pdo,$t))throw new RuntimeException('Missing table '.$t);}
            $ctx=deployment_step19_context($pdo);$settings=deployment_step19_settings($pdo,(int)$ctx['organization_id']);
            echo 'STEP19_TABLE_COUNT='.count(deployment_step19_support_tables())."\n";
            echo 'ENV='.deployment_step19_env()."\n";
            echo 'HTTPS_POLICY='.(int)$settings['require_https_in_production']."\n";
            echo "STEP19_SQL_DIAGNOSTIC=PASS\n";
          }catch(Throwable $e){echo 'STEP19_SQL_DIAGNOSTIC=FAIL: '.$e->getMessage()."\n";}
          PHP
          echo "PHP_DIAG_EXIT=$?" >> "$report"
          exit 0
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/step19_sql_diagnostic.txt
          git commit -m "STEP 19: capture MySQL migration diagnostic"
          git push origin main
