name: One-time STEP 18 MySQL metadata keycase fix

on:
  push:
    paths:
      - '.github/workflows/one-time-step18-mysql-keycase-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize information_schema row keys
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/config/backup_step18.php')
          s=p.read_text(encoding='utf-8')
          old="    foreach($rows as $r){if($insertableOnly&&str_contains(strtoupper((string)$r['extra']),'GENERATED'))continue;$out[]=$r;}"
          new="    foreach($rows as $r){$r=array_change_key_case($r,CASE_LOWER);if($insertableOnly&&str_contains(strtoupper((string)($r['extra']??'')),'GENERATED'))continue;$out[]=$r;}"
          if old not in s:
              raise SystemExit('backup_step18_columns metadata loop not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: PHP lint
        run: php -l business/config/backup_step18.php
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/backup_step18.php
          git commit -m "STEP 18: normalize MySQL information schema metadata keys"
          git push origin main
