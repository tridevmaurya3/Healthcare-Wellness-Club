name: One-time STEP 13 finalize

on:
  push:
    paths:
      - '.github/workflows/one-time-step13-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final STEP 13 compatibility patches
        shell: python
        run: |
          from pathlib import Path

          service = Path('business/config/inventory_step13.php')
          text = service.read_text(encoding='utf-8')
          old = "return $batchCode !== '' ? mb_substr($batchCode, 0, 120, 'UTF-8') : 'UNBATCHED-' . $listingId;"
          new = "return $batchCode !== '' ? (function_exists('mb_substr') ? mb_substr($batchCode, 0, 120, 'UTF-8') : substr($batchCode, 0, 120)) : 'UNBATCHED-' . $listingId;"
          if old not in text:
              raise SystemExit('Batch-code compatibility target was not found.')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          stocktake = Path('business/inventory_stocktake.php')
          text = stocktake.read_text(encoding='utf-8')
          text = text.replace("require_once __DIR__ . '/config/inventory_step13.php';", "require_once __DIR__ . '/config/inventory_step13_stocktake.php';", 1)
          text = text.replace('inventory_step13_post_stock_count($pdo,$productId,$counted,$date,$ref,$notes)', 'inventory_step13_post_stock_count_atomic($pdo,$productId,$counted,$date,$ref,$notes)', 1)
          stocktake.write_text(text, encoding='utf-8')

          gs = Path('business/global_search.php')
          text = gs.read_text(encoding='utf-8')
          marker = " ['Today Center','today daily command followup quick activity'"
          insert = " ['Inventory Center','inventory stock batch expiry low stock reorder warehouse','Current stock, batches, expiry and action queue.','inventory_center.php','INVENTORY'],['Stock Inward','inventory purchase opening stock batch lot expiry supplier','Add real opening or purchase stock.','inventory_inward.php','STOCK IN'],['Inventory Adjustments','inventory damage loss return supplier adjustment','Damage, loss, returns and stock corrections.','inventory_adjustments.php','ADJUST'],['Physical Stocktake','inventory physical count stocktake variance','Reconcile physical count with system stock.','inventory_stocktake.php','COUNT'],['Inventory Analytics','inventory analytics reorder expiry valuation movement','Stock health, movement and reorder insights.','inventory_analytics.php','ANALYTICS'],['STEP 13 Inventory Audit','step 13 inventory audit stock ledger fefo','Verify the complete Inventory & Stock system.','step13_audit.php','STEP 13'],\n"
          if marker not in text:
              raise SystemExit('Global Search tool insertion point was not found.')
          text = text.replace(marker, insert + marker, 1)
          gs.write_text(text, encoding='utf-8')

      - name: PHP syntax check STEP 13 and integrations
        run: |
          set -e
          files=(
            business/config/inventory_step13.php
            business/config/inventory_step13_stocktake.php
            business/config/product_step12_bridge.php
            business/inventory_center.php
            business/inventory_inward.php
            business/inventory_adjustments.php
            business/inventory_stocktake.php
            business/inventory_settings.php
            business/inventory_sales_sync.php
            business/inventory_analytics.php
            business/inventory_export.php
            business/step13_audit.php
            business/dashboard_step13.php
            business/global_search.php
            business/index.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Commit final STEP 13 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/inventory_step13.php business/inventory_stocktake.php business/global_search.php
          git commit -m "STEP 13: finalize linted inventory integration and global search" || exit 0
          git push origin main
