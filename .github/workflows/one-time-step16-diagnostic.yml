name: One-time STEP 16 diagnostic

on:
  push:
    paths:
      - '.github/workflows/one-time-step16-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safe patches
        shell: python
        run: |
          from pathlib import Path
          p=Path('business/config/finance_step16.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("finance_step16_post_journal($pdo,date('Y-m-d'),'reversal'", "finance_step16_post_journal($pdo,(string)$j['journal_date'],'reversal'")
          s=s.replace("return round((float)$cash['opening_balance']+(float)$stmt->fetchColumn(),2);", "return round((float)$stmt->fetchColumn(),2);")
          old="$lines=[['role'=>'sales_returns','debit'=>$credit],['role'=>'accounts_receivable','credit'=>$credit]];if((int)$r['missing_cost']===0&&$cost>0){$lines[]=['role'=>'inventory_asset','debit'=>$cost];$lines[]=['role'=>'cogs','credit'=>$cost];}finance_step16_sync_source($pdo,'sales_return',(int)$r['id'],'credit_note',(string)$r['return_date'],'customer_return','Customer Return '.$r['return_number'],'CUSTOMER-SALES',['status'=>$r['status'],'credit'=>$credit,'cost'=>$cost,'missing_cost'=>(int)$r['missing_cost'],'has_invoice'=>(int)$r['has_invoice']],$lines,$active&&$credit>0);"
          new="$lines=[];if($credit>0){$lines[]=['role'=>'sales_returns','debit'=>$credit];$lines[]=['role'=>'accounts_receivable','credit'=>$credit];}if((int)$r['missing_cost']===0&&$cost>0){$lines[]=['role'=>'inventory_asset','debit'=>$cost];$lines[]=['role'=>'cogs','credit'=>$cost];}$hasEffect=$credit>0||((int)$r['missing_cost']===0&&$cost>0);finance_step16_sync_source($pdo,'sales_return',(int)$r['id'],'credit_note',(string)$r['return_date'],'customer_return','Customer Return '.$r['return_number'],'CUSTOMER-SALES',['status'=>$r['status'],'credit'=>$credit,'cost'=>$cost,'missing_cost'=>(int)$r['missing_cost'],'has_invoice'=>(int)$r['has_invoice']],$lines,$active&&$hasEffect);"
          s=s.replace(old,new)
          old="$lines=[['role'=>'accounts_payable','debit'=>$credit],['role'=>'inventory_asset','credit'=>$cost]];if($credit>$cost+0.01)$lines[]=['role'=>'purchase_return_gain','credit'=>round($credit-$cost,2)];elseif($cost>$credit+0.01)$lines[]=['role'=>'purchase_return_loss','debit'=>round($cost-$credit,2)];finance_step16_sync_source($pdo,'purchase_return',(int)$r['id'],'supplier_credit',(string)$r['return_date'],'supplier_return','Supplier Return '.$r['return_number'],'PURCHASES',['status'=>$r['status'],'credit'=>$credit,'inventory_cost'=>$cost],$lines,$r['status']==='posted'&&($credit>0||$cost>0));"
          new="$lines=[];if($credit>0)$lines[]=['role'=>'accounts_payable','debit'=>$credit];if($cost>0)$lines[]=['role'=>'inventory_asset','credit'=>$cost];if($credit>$cost+0.01)$lines[]=['role'=>'purchase_return_gain','credit'=>round($credit-$cost,2)];elseif($cost>$credit+0.01)$lines[]=['role'=>'purchase_return_loss','debit'=>round($cost-$credit,2)];finance_step16_sync_source($pdo,'purchase_return',(int)$r['id'],'supplier_credit',(string)$r['return_date'],'supplier_return','Supplier Return '.$r['return_number'],'PURCHASES',['status'=>$r['status'],'credit'=>$credit,'inventory_cost'=>$cost],$lines,$r['status']==='posted'&&($credit>0||$cost>0));"
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          g=Path('business/global_search.php')
          t=g.read_text(encoding='utf-8')
          if "['Finance Center','finance accounting cash bank journal receivable payable'" not in t:
              marker=" ['Today Center','today daily command followup quick activity'"
              block=" ['Finance Center','finance accounting cash bank journal receivable payable','Double-entry Finance & Accounting command center.','finance_center.php','FINANCE'],['Cash Bank Accounts','finance cash bank upi wallet clearing account','Manage explicit real and system clearing accounts.','finance_accounts.php','ACCOUNTS'],['Finance Manual Entry','finance income expense transfer journal entry','Post balanced manual income, expense or transfer.','finance_entry.php','ENTRY'],['Journal Ledger','finance journal debit credit source reversal','Trace every balanced accounting journal.','finance_journal.php','JOURNAL'],['Cashbook Bankbook','finance cashbook bankbook running balance','Liquid-account movements and running balances.','finance_cashbook.php','CASHBOOK'],['Profit Loss','finance pnl profit loss income expense cogs','Ledger-based Profit & Loss with explicit-cost COGS.','finance_profit_loss.php','P&L'],['Cash Flow','finance cash flow inflow outflow direct','Direct liquid-account cash movement statement.','finance_cash_flow.php','CASH FLOW'],['Finance AR AP','finance receivable payable control account','Reconcile customer/supplier sub-ledgers with GL.','finance_receivable_payable.php','AR/AP'],['Finance Reconciliation','bank reconciliation statement match closing balance','Match statements and verify ending balances.','finance_reconciliation.php','RECONCILE'],['Legacy Finance Bridge','legacy income royalty cash confirmation excel','Explicitly confirm historical operational income as received money.','finance_legacy_bridge.php','LEGACY'],['Monthly Finance','finance monthly summary profit cash movement','Month-wise accrual profit and cash movement.','finance_monthly.php','MONTHLY'],['Finance Export','finance export csv print pdf journal cashbook pnl','Export accounting reports.','finance_export.php','EXPORT'],['STEP 16 Finance Audit','step 16 finance accounting audit double entry','Verify Finance & Accounting integrity.','step16_audit.php','STEP 16'],\n"
              if marker not in t:
                  raise SystemExit('Today Center insertion marker missing')
              t=t.replace(marker,block+marker,1)
              g.write_text(t,encoding='utf-8')

      - name: Capture PHP lint report
        shell: bash
        run: |
          set +e
          report="business/config/step16_lint_report.txt"
          : > "$report"
          fail=0
          for f in \
            business/config/finance_step16.php \
            business/finance_center.php \
            business/finance_accounts.php \
            business/finance_entry.php \
            business/finance_journal.php \
            business/finance_cashbook.php \
            business/finance_profit_loss.php \
            business/finance_cash_flow.php \
            business/finance_receivable_payable.php \
            business/finance_reconciliation.php \
            business/finance_legacy_bridge.php \
            business/finance_monthly.php \
            business/finance_export.php \
            business/step16_audit.php \
            business/dashboard_step16.php \
            business/index.php \
            business/global_search.php; do
              echo "### $f" >> "$report"
              php -l "$f" >> "$report" 2>&1
              code=$?
              if [ $code -ne 0 ]; then fail=1; fi
            done
          echo "FINAL_LINT_STATUS=$fail" >> "$report"
          exit 0

      - name: Commit patches and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/config/finance_step16.php business/global_search.php business/config/step16_lint_report.txt
          git commit -m "STEP 16: apply finance safety and capture PHP lint report"
          git push origin main
